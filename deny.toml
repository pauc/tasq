# cargo-deny configuration. Run `cargo deny check` locally; CI runs it via
# EmbarkStudios/cargo-deny-action (see .github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities fail the build (default). Crates that are merely unmaintained
# or yanked are reported as warnings so a stale transitive dependency does not
# block unrelated work; they still show up in the CI log.
version = 2
unmaintained = "workspace"
yanked = "warn"

[licenses]
version = 2
# tasq is GPL-3.0-or-later. Everything below is one-way compatible with GPLv3
# (permissive or weak-copyleft), so it may be linked into the binary.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # webpki-roots (Mozilla's CA bundle, pulled in by ureq/rustls): permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
