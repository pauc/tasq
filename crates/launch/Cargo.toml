[package]
name = "tasq-launch"
description = "tasq Launchers (shell, Claude Code, tmux, herdr) and worktree managers (git, command)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
default = ["herdr"]
# The herdr launcher (the author's terminal workspace manager); parses
# herdr's JSON replies, hence the serde_json dependency.
herdr = ["dep:serde_json"]

[dependencies]
tasq-core = { path = "../core", version = "0.1.0" }
# `#[mutants::skip]` on the functions that only spawn processes.
mutants = "0.0.4"
serde_json = { version = "1", optional = true }
# Splits `report.summary.command` into argv without a shell.
shell-words = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"

[lints]
workspace = true
