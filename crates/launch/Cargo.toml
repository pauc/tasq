[package]
name = "tasq-launch"
description = "tasq Launchers (shell, Claude Code, tmux, herdr) and worktree managers (git, command)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tasq-core = { path = "../core" }
# `#[mutants::skip]` on the functions that only spawn processes.
mutants = "0.0.4"
# Splits `work.worktree_command` into argv without a shell.
shell-words = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
