[package]
name = "tasq-sources"
description = "tasq Sources: GitLab and GitHub forge clients, review-request and work-item sources, and the LLM bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
tasq-core = { path = "../core", version = "0.1.0" }
# `#[mutants::skip]` on the functions that only do network or process I/O.
mutants = "0.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `token_cmd` is split into argv without a shell.
shell-words = "1"
thiserror = "2"
# Blocking HTTP with rustls; the only network dependency of the workspace.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
