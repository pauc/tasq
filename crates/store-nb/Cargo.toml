[package]
name = "tasq-store-nb"
description = "nb-compatible markdown Store for tasq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
tasq-core = { path = "../core", version = "0.1.0" }
# The revision check and the diff-and-apply module moved to the tasq store
# (ADR-0026, SV-002); re-exported here until this crate is deleted.
tasq-store = { path = "../store", version = "0.1.0" }
# Filenames are the creation timestamp (`YYYYMMDDHHMMSS.todo.md`); `clock`
# reads the store's local-time `Clock` as an instant for the background job.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `#[mutants::skip]` for the functions that only spawn processes; a regular
# dependency because the attribute sits on non-test code (see tasq-core).
mutants = "0.0.4"
# Atomic writes: `NamedTempFile::persist` in the task's own directory.
# Diagnostics and bookkeeping results derive Serialize for `tasq doctor --json`.
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# `find_in_path`, to locate the real `nb` and `git` on the test process's PATH.
tasq-launch = { path = "../launch", version = "0.1.0" }

[lints]
workspace = true
