[package]
name = "tasq-store-nb"
description = "nb-compatible markdown Store for tasq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
tasq-core = { path = "../core", version = "0.1.0" }
# Filenames are the creation timestamp (`YYYYMMDDHHMMSS.todo.md`).
chrono = { version = "0.4", default-features = false }
# `#[mutants::skip]` for the functions that only spawn processes; a regular
# dependency because the attribute sits on non-test code (see tasq-core).
mutants = "0.0.4"
# Atomic writes: `NamedTempFile::persist` in the task's own directory.
# Diagnostics and bookkeeping results derive Serialize for `tasq doctor --json`.
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
