[package]
name = "tasq-core"
description = "tasq domain model, Store/Source/Launcher traits, config, reconciliation and reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Dates and timestamps (`NaiveDate`, `NaiveDateTime`). `clock` is only needed
# by `SystemClock`; `serde` so model types with dates derive Serialize.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# Provides the `#[mutants::skip]` attribute for cargo-mutants. It must be a
# regular dependency (not dev) because the attribute sits on non-test code.
# See the "Mutation testing" note in src/lib.rs.
mutants = "0.0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
