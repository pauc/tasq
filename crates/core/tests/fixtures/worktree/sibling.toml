# A workspace of sibling checkouts named after their branch, with shared
# dependencies linked in and an .envrc rendered from a template.
[worktree]
path = "{{project_parent}}/{{branch_safe}}"
symlinks = ["node_modules", "CLAUDE.local.md", "config/master.key"]
templates = [{ source = "templates/.envrc.template", target = ".envrc" }]

[worktree.variables]
app_env = "development"

[worktree.hooks]
post-create = ["direnv allow ."]
