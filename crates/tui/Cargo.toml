[package]
name = "tasq-tui"
description = "ratatui terminal UI for tasq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
tasq-core = { path = "../core", version = "0.1.0" }
# The widgets, the terminal and the crossterm backend (events are read
# through `ratatui::crossterm`, so the two versions always agree).
ratatui = "0.30"
# `#[mutants::skip]` on the functions that only drive the terminal.
mutants = "0.0.4"

[dev-dependencies]
chrono = { version = "0.4", default-features = false }
insta = "1"

[lints]
workspace = true
