# The author's setup: one tasq store, a self-hosted GitLab, worktrees per task,
# Claude Code sessions (herdr when inside herdr), an LLM-summarised standup
# and a time-log plugin fed by hooks. Plan section 4.6, with the key names
# the tool actually has. Full reference: docs/config.md.
#
# Secrets never live here: the GitLab token comes from `glab config get token`.

worktrees_enabled = true     # the [worktree] settings below apply (ADR 0031)

[store]
name = "home"                # ~/.local/share/tasq/stores/home

[workflow]
statuses = ["in-progress", "ready", "waiting", "blocked", "later"]
default_status = "ready"

[work]
default_project = "~/code/silverfin"       # sessions start here when a task tracks nothing

[launch]
default = "auto"             # herdr workspace when HERDR_ENV is set, else Claude Code
env = "direnv"               # `direnv exec <dir>` so the session gets the project's .envrc

[launch.claude]
# prompt_file = "~/.config/tasq/prompts/claude.md"   # built-in template when unset

[launch.herdr]
placement = "workspace"      # Ctrl+Enter / Shift+Enter in `tasq ui` always open a new herdr workspace

[ui]
pager = "less -RFX"
no_osc8 = false
glow_style = "dark"
detail_position = "bottom"   # the task detail under the list in `tasq ui`

[ui.theme]
# preset = "light"           # dark (default), light, solarized, gruvbox, mono; see docs/config.md "Colours"

[ui.theme.colors]
# focus = "208"              # role = colour, over the preset

[ui.colors]
# ready = "208"              # status name = colour, over the theme

[ui.keys]                    # action = key or list, [] unbinds; see docs/config.md "Key bindings"
# launch-window = "alt+enter"   # Ghostty keeps Ctrl+Enter for fullscreen

[forge.gitlab]               # kind "gitlab" inferred from the block name
host = "gitlab.silverfin.com"
token_cmd = "glab config get token --host gitlab.silverfin.com"

[[source]]
name = "gitlab-review-requests"
kind = "gitlab-review-requests"
forge = "gitlab"
tags = ["gitlab", "review-request"]
status = "ready"
flag = "review-request"      # older tasks that match an MR get the tag too

[[source]]
name = "gitlab-work-items"
kind = "gitlab-work-items"
forge = "gitlab"
tags = ["gitlab"]
status = "later"
projects = ["silverfin/"]    # only this group; a trailing / matches every project under it
exclude_labels = ["wontfix"]

[[source]]
name = "inbox"
kind = "llm-bridge"
command = "claude -p --output-format json"
prompt_file = "~/.config/tasq/prompts/inbox.md"   # see examples/sources/inbox.md
tags = ["inbox"]
auto = false                 # ~90 s and ~$2 a run: only with `tasq sync --source inbox` or the TUI's `S`

[report.summary]
summarizer = "llm"
command = "claude -p"
model = "sonnet"             # passed as --model sonnet

[hooks]
# Each entry is a command line (split without a shell, ~ expanded). The command
# reads {"schema":1,"hook":"<name>","task":{...}} on stdin and gets TASQ_HOOK,
# TASQ_TASK_ID and TASQ_BIN in its environment. A post hook that fails is a
# warning; a failing pre-launch hook aborts the launch. The example hook under
# examples/plugins/hooks/ appends one line per event to a log file.
post-create = []
post-done = ["~/code/tasq/examples/plugins/hooks/log-event.sh"]
pre-launch = []

[worktree]
# Every task in a git project gets a declared worktree, created when the task is
# launched and released when it is closed (docs/config.md, "Worktrees").
# Per-repository links, copies, templates and hooks go in a .tasq.toml next to
# the repository; these are the personal defaults.
path = "{{project_parent}}/{{branch_safe}}"   # siblings of the main checkout
branch = "{{id}}-{{slug}}"
