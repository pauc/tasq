# Example sources for `tasq sync`. Merge into ~/.config/tasq/config.toml.

[forge.gitlab]
host = "gitlab.example.com"
# glab 1.118 has no `auth token` subcommand (it prints help with exit 0), hence `config get`.
token_cmd = "glab config get token --host gitlab.example.com"

[[source]]
name = "gitlab-review-requests"
kind = "gitlab-review-requests"
forge = "gitlab"
tags = ["gitlab", "review-request"]
status = "ready"
flag = "review-request"
exclude_authors = ["dependabot"]   # dependency bumps are not reviews; drafts are skipped by default

[[source]]
name = "gitlab-work-items"
kind = "gitlab-work-items"
forge = "gitlab"
tags = ["gitlab"]
status = "later"
projects = ["my-group/"]
exclude_labels = ["wontfix"]

# Slack/Gmail through headless Claude Code; copy inbox.md next to this file to prompt_file.
# Verified 2026-10-05: `claude -p` gets the claude.ai connectors of the interactive session.
# One run is ~90 s and ~$2 (docs/sources.md, "Headless Claude Code"), so `auto = false` keeps
# it out of a bare `tasq sync`; run it on purpose with `tasq sync --source inbox` or the `S`
# picker of `tasq ui`.
[[source]]
name = "inbox"
kind = "llm-bridge"
command = "claude -p --output-format json"
prompt_file = "~/.config/tasq/prompts/inbox.md"
tags = ["inbox"]
auto = false
