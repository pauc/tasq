[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/sources",
    "crates/launch",
    "crates/worktree",
    "crates/cli",
    "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; we keep a few minors of headroom below the pinned
# stable (1.98) so distro toolchains can still build the workspace.
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/pauc/tasq"
homepage = "https://github.com/pauc/tasq"
keywords = ["todo", "tasks", "markdown", "frontmatter", "cli"]
categories = ["command-line-utilities"]
authors = ["Pau Compte"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Types like `model::Task` or `config::Config` are the natural names; the
# module prefix is how the workspace is organised, not noise.
module_name_repetitions = "allow"
# Pure accessors and constructors would all need `#[must_use]`; the lint is
# almost always noise on a domain library and we opt in per function instead.
must_use_candidate = "allow"
# Attaching an `# Errors` section to every fallible function is churn for
# internal APIs; public surfaces document their errors where it matters.
missing_errors_doc = "allow"
# Same reasoning as `missing_errors_doc`: panics are rare and documented
# where they are part of the contract.
missing_panics_doc = "allow"
# Restriction lints, opted into one by one. Tests may unwrap, print and
# `dbg!` (clippy.toml). `expect` stays allowed: its message names the
# invariant, which is the point.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Libraries return data; only the CLI and the launchers talk to the terminal.
print_stdout = "warn"
print_stderr = "warn"
# Every `#[allow]` says why, like every `#[mutants::skip]` does.
allow_attributes_without_reason = "warn"

# Less debuginfo keeps rustc and the linker well under a gigabyte per crate
# during dev builds and tests; backtraces still carry line numbers.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
